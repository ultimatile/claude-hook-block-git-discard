[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-hook-block-git-discard"
version = "0.1.0"
description = "Claude Code PreToolUse hook that refuses git commands which would irreversibly discard uncommitted work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ultimatile" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
block-git-discard = "block_git_discard:main"

[project.urls]
Homepage = "https://github.com/ultimatile/claude-hook-block-git-discard"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["block_git_discard"]

[tool.ruff]
# Pinned rather than left to ruff's defaults, which resolve differently depending
# on what config a contributor's machine happens to expose. Pinned, the lint
# surface is a property of this file rather than of whoever runs it.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# `BLE` and `RUF100` are here for the same reason as each other. This hook
# catches broadly ON PURPOSE wherever a raise would escape, because an escaping
# raise is a non-zero exit, which the harness reports as a non-blocking error
# before running the command. Each such catch carries `# noqa: BLE001` to say
# the breadth is deliberate. Without `BLE` selected those directives suppress
# nothing, so the file reads as though blind-except were checked and waived
# while nothing checks it, and a catch added later draws no comment at all.
# `RUF100` makes that failure loud: it is the rule that reports a `noqa`
# guarding against a rule this project does not run.
#
# No count of those sites is given here, on purpose. They live in other files, so
# a number written here has nothing to bring it back into agreement with them.
select = ["E", "W", "F", "I", "B", "BLE", "C4", "UP", "ARG", "SIM", "PTH", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
# The acceptance sweeps are opt-in: `uv run pytest -m acceptance`. Excluded by
# default because they take minutes, and a suite that takes minutes stops being
# run before a commit. `oracle/README.md` states what they claim, what they
# cost, and why a count of review findings is no substitute for them.
markers = ["acceptance: the oracle-backed acceptance sweeps (slow; see oracle/)"]
addopts = "-m 'not acceptance'"
