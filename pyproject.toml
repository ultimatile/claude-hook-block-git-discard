[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-hook-block-git-discard"
version = "0.1.0"
description = "Claude Code PreToolUse hook that refuses git commands which would irreversibly discard uncommitted work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ultimatile" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
block-git-discard = "block_git_discard:main"

[project.urls]
Homepage = "https://github.com/ultimatile/claude-hook-block-git-discard"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["block_git_discard"]

[tool.ruff]
# Pinned rather than left to ruff's defaults, which resolve differently
# depending on what config a contributor's machine happens to expose. This is
# the same selection the hook was written and reviewed under in the tree it came
# from, so the lint surface does not shift underneath it in the move.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# `BLE` and `RUF100` are additions to the selection this code was reviewed
# under, and they are here for the same reason as each other. This hook catches
# broadly ON PURPOSE wherever a raise would escape, because an escaping raise is
# a non-zero exit, which the harness reports as a non-blocking error before
# running the command. Each such catch carries `# noqa: BLE001` to say the
# breadth is deliberate. Without `BLE` selected the directives suppressed
# nothing, so the file read as though blind-except were checked and waived while
# nothing checked it, and a catch added later would have drawn no comment at
# all. `RUF100` is what makes that failure loud: it is the rule that reports a
# `noqa` guarding against a rule this project does not run.
#
# No count is given here on purpose. One was, and it was wrong within the same
# change that wrote it -- the sites are in another file, so nothing brings a
# number here back into agreement with them.
select = ["E", "W", "F", "I", "B", "BLE", "C4", "UP", "ARG", "SIM", "PTH", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
