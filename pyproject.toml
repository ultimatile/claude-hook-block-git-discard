[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-hook-block-git-discard"
version = "0.1.0"
description = "Claude Code PreToolUse hook that refuses git commands which would irreversibly discard uncommitted work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ultimatile" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
block-git-discard = "block_git_discard:main"

[project.urls]
Homepage = "https://github.com/ultimatile/claude-hook-block-git-discard"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["block_git_discard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
