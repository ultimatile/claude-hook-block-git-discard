[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-hook-block-git-discard"
version = "0.1.0"
description = "Claude Code PreToolUse hook that refuses git commands which would irreversibly discard uncommitted work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ultimatile" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
block-git-discard = "block_git_discard:main"

[project.urls]
Homepage = "https://github.com/ultimatile/claude-hook-block-git-discard"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["block_git_discard"]

[tool.ruff]
# Pinned rather than left to ruff's defaults, which resolve differently
# depending on what config a contributor's machine happens to expose. This is
# the same selection the hook was written and reviewed under in the tree it came
# from, so the lint surface does not shift underneath it in the move.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
